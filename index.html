<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Budget Dashboard</title>
  <link rel="stylesheet" href="styles.css?v=5" />
</head>
<body class="dashboard-page">
  <main class="page-shell">
    <section class="hero">
      <div>
        <p class="eyebrow">Family Budget</p>
        <h1>ตั้งงบแบบ 50 - 30 - 20</h1>
        <p class="muted">ใส่รายได้ต่อเดือน แล้วระบบจะคำนวณ Need / Want / Savings ให้ทันที</p>
      </div>
      <a class="secondary-btn" href="payments.html">ไปหน้า Payment Management</a>
    </section>

    <section class="card grid-2">
      <div class="panel">
        <h2>ตั้งรายได้และสัดส่วน</h2>
        <div class="form-grid">
          <label>
            <span>รายได้ต่อเดือน</span>
            <input id="incomeInput" type="number" min="0" step="1" placeholder="เช่น 30000" />
          </label>

          <label>
            <span>Need %</span>
            <input id="needInput" type="number" min="0" max="100" step="1" value="50" />
          </label>

          <label>
            <span>Want %</span>
            <input id="wantInput" type="number" min="0" max="100" step="1" value="30" />
          </label>

          <label>
            <span>Savings %</span>
            <input id="saveInput" type="number" min="0" max="100" step="1" value="20" />
          </label>
        </div>

        <div class="actions">
          <button id="saveBtn" class="primary-btn">บันทึกและอัปเดต</button>
          <button id="resetBtn" class="ghost-btn">รีเซ็ตเป็น 50-30-20</button>
        </div>

        <p id="ratioWarning" class="warning hidden"></p>
      </div>

      <div class="panel chart-panel">
        <h2>Pie chart</h2>
        <div class="pie-wrap">
          <div id="pieChart" class="pie-chart" aria-label="Budget pie chart"></div>
          <div class="pie-center">
            <strong id="incomeLabel">฿0</strong>
            <span>ต่อเดือน</span>
          </div>
        </div>
        <div class="legend">
          <div><span class="dot need"></span>Need: <strong id="needAmount">฿0</strong></div>
          <div><span class="dot want"></span>Want: <strong id="wantAmount">฿0</strong></div>
          <div><span class="dot save"></span>Savings: <strong id="saveAmount">฿0</strong></div>
        </div>
      </div>
    </section>

    <section class="card panel">
      <h2>สรุปงบแบบอ่านง่าย</h2>
      <div class="summary-grid">
        <article class="summary-item need">
          <h3>Need</h3>
          <p id="needSummary">฿0</p>
        </article>
        <article class="summary-item want">
          <h3>Want</h3>
          <p id="wantSummary">฿0</p>
        </article>
        <article class="summary-item save">
          <h3>Savings</h3>
          <p id="saveSummary">฿0</p>
        </article>
      </div>
    </section>
  </main>

  <div id="confettiRoot"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
